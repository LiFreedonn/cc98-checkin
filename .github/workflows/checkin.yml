name: CC98 Daily Check-in

on:
  workflow_dispatch: # 支持在 Actions 界面或外部 API 手动/定时触发
  schedule:
    # 每天北京时间 08:35 (对应 UTC 00:35)，避开整点高峰
    - cron: '35 0 * * *'

permissions:
  contents: read

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Download cc98-autosign-fast
        run: |
          curl -sL "https://github.com/Anchorite-no/cc98-autosign-fast/releases/latest/download/cc98-autosign-fast-linux-amd64.tar.gz" | tar -xz --strip-components=1
          chmod +x cc98-autosign-fast

      - name: Generate .env configuration
        env:
          WEBVPN_USER: ${{ secrets.WEBVPN_USER }}
          WEBVPN_PASS: ${{ secrets.WEBVPN_PASS }}
          CC98_USER: ${{ secrets.CC98_USER }}
          CC98_PASS: ${{ secrets.CC98_PASS }}
          CC98_USER_1: ${{ secrets.CC98_USER_1 }}
          CC98_PASS_1: ${{ secrets.CC98_PASS_1 }}
          CC98_USER_2: ${{ secrets.CC98_USER_2 }}
          CC98_PASS_2: ${{ secrets.CC98_PASS_2 }}
          CC98_USER_3: ${{ secrets.CC98_USER_3 }}
          CC98_PASS_3: ${{ secrets.CC98_PASS_3 }}
          CC98_USER_4: ${{ secrets.CC98_USER_4 }}
          CC98_PASS_4: ${{ secrets.CC98_PASS_4 }}
          CC98_USER_5: ${{ secrets.CC98_USER_5 }}
          CC98_PASS_5: ${{ secrets.CC98_PASS_5 }}
        run: |
          set -euo pipefail

          if [ -z "${WEBVPN_USER:-}" ] || [ -z "${WEBVPN_PASS:-}" ]; then
            echo "::error::缺少 WEBVPN_USER 或 WEBVPN_PASS，请在仓库 Settings -> Secrets and variables -> Actions 中设置"
            exit 1
          fi

          python3 - << 'PYEOF'
          import os
          import sys

          webvpn_user = os.environ.get("WEBVPN_USER", "").strip()
          webvpn_pass = os.environ.get("WEBVPN_PASS", "").strip()

          accounts = []

          # 账号 1 兼容：优先读取 CC98_USER_1，其次 CC98_USER
          u1 = os.environ.get("CC98_USER_1", "").strip() or os.environ.get("CC98_USER", "").strip()
          p1 = os.environ.get("CC98_PASS_1", "").strip() or os.environ.get("CC98_PASS", "").strip()
          if u1 and p1:
              accounts.append((u1, p1))

          # 账号 2 到 5
          for i in range(2, 6):
              u = os.environ.get(f"CC98_USER_{i}", "").strip()
              p = os.environ.get(f"CC98_PASS_{i}", "").strip()
              if u and p:
                  accounts.append((u, p))

          if not accounts:
              print("::error::未检测到任何 CC98 账号！请设置 CC98_USER 或 CC98_USER_1", file=sys.stderr)
              sys.exit(1)

          with open(".env", "w", encoding="utf-8") as f:
              f.write(f"WEBVPN_USER={webvpn_user}\n")
              f.write(f"WEBVPN_PASS={webvpn_pass}\n")
              f.write(f"CC98_ACCOUNT_COUNT={len(accounts)}\n")
              for idx, (u, p) in enumerate(accounts, start=1):
                  f.write(f"CC98_USER_{idx}={u}\n")
                  f.write(f"CC98_PASS_{idx}={p}\n")

          print(f"成功加载 {len(accounts)} 个 CC98 账号配置")
          PYEOF

      - name: Run Check-in
        run: |
          ./cc98-autosign-fast
